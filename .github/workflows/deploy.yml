name: SAFING CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ai/**'
      - 'nginx/**'
      - 'docker-compose.yml'
  workflow_dispatch:

# GHCR (GitHub Container Registry) 이미지 쓰기 권한
permissions:
  contents: read
  packages: write

jobs:
  # -------------------------------------------------------------
  # 1. 변경된 폴더 감지 (Path Filter)
  # -------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            ai:
              - 'ai/**'
            infra:
              - 'nginx/**'
              - 'docker-compose.yml'

  # -------------------------------------------------------------
  # 2. 백엔드 (Spring Boot) GHCR 빌드 & Push
  # -------------------------------------------------------------
  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sql 파일 확인
      - name: Check Migration Files in Runner
        run: |
          echo "=== Migration Files in Repository ==="
          ls -la backend/src/main/resources/db/migration/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Spring Boot Jar
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      # 빌드된 jar 파일 내부에 SQL 마이그레이션 파일 복사되었는지 검증
      - name: Check Migration Files inside Built JAR
        run: |
          echo "=== Migration Files inside JAR ==="
          jar tf backend/build/libs/*.jar | grep db/migration

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/safing-backend:latest

  # -------------------------------------------------------------
  # 3. AI (FastAPI) GHCR Push
  # -------------------------------------------------------------
  build-ai:
    needs: changes
    if: ${{ needs.changes.outputs.ai == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push AI Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: ghcr.io/${{ github.repository }}/safing-ai:latest

  # -------------------------------------------------------------
  # 4. SAFING 서버 배포 (CD)
  # -------------------------------------------------------------
  deploy:
    needs: [changes, build-backend, build-ai]
    if: always() && (needs.build-backend.result == 'success' || needs.build-ai.result == 'success' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    steps:
      # safing-deploy 계정으로 SSH 접속하여 배포 스크립트 트리거
      - name: Trigger Deploy Script via Restricted SSH
        uses: appleboy/ssh-action@v1.0.3   # SSH로 원격 서버에 명령을 보내주는 서드파티 action
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: echo "Deploying..."